name: Main Taski workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==7.5.0 flake8-isort==7.1.0
          python -m pip install -r backend/requirements.txt
      - name: Check Python style
        run: python -m flake8 backend/
      - name: Run Django tests
        working-directory: backend
        run: python manage.py test

  frontend_tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        env:
          CI: 'true'
        run: npm run build

  build_and_push:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    needs: [backend_tests, frontend_tests]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taski_${{ matrix.component }}:latest
